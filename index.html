<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="FocusRoom: campus-verified, camera-free study rooms. Interactive MVP by Byte Squad.">
<link rel="icon" type="image/png" href="logo.png">
<title>FocusRoom MVP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Stylesheets: order matters, later files deliberately override earlier ones. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/landing.css">
<link rel="stylesheet" href="css/rooms.css">
<link rel="stylesheet" href="css/session.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/rooms-v3.css">
<link rel="stylesheet" href="css/glass.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/tour.css">
</head>
<body>

<header class="site-header"><div class="shell nav">
  <button class="brand" onclick="go('welcome')" aria-label="FocusRoom home"><img src="logo.png" alt=""><span>focus room<span class="dot">.</span></span></button>
  <nav class="nav-right glass refract" id="nav"></nav>
</div></header>
<div id="app"></div>
<footer class="footer"><div class="shell"><span>FocusRoom · Byte Squad · MVP v3: Focus rooms and Study sessions</span><span>Classroom prototype. Activity tracking only reads this page, and nothing leaves your browser.</span></div></footer>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><filter id="lgRefract" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB"><feImage id="lgMap" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="map"/><feDisplacementMap in="SourceGraphic" in2="map" scale="0.05" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<nav class="tabbar glass refract" id="tabbar" aria-label="Main">
 <span class="tab-ind" id="tabInd"></span>
 <button data-k="focus" onclick="startDemo(()=>go('focus'))"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg><span>Focus</span></button>
 <button data-k="study" onclick="startDemo(()=>go('study'))"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>Study</span></button>
 <button data-k="log" onclick="go('log')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>Log</span></button>
 <button data-k="plus" onclick="go('plus')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.4 5.2 5.6.6-4.2 3.8 1.2 5.6L12 15.4 7 18.2l1.2-5.6L4 8.8l5.6-.6z"/></svg><span>Plus</span></button>
 <button data-k="map" onclick="go('map')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Map</span></button>
</nav>
<button class="return-chip glass dark refract" id="returnChip" hidden onclick="returnToRoom()"><span class="live-dot"></span><span id="returnTxt"></span><b>Return</b></button>


<!-- Plain (non-module) scripts sharing one global scope, so inline onclick handlers keep working
     and the page still opens straight from disk. Order matters: main.js boots the app and must be last. -->
<script src="js/core/glass.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/core/data.js"></script>
<script src="js/core/helpers.js"></script>
<script src="js/core/tracking.js"></script>
<script src="js/core/sound.js"></script>
<script src="js/nav.js"></script>
<script src="js/views/welcome.js"></script>
<script src="js/views/rooms.js"></script>
<script src="js/session/join.js"></script>
<script src="js/session/shared.js"></script>
<script src="js/session/focus.js"></script>
<script src="js/session/study.js"></script>
<script src="js/session/phases.js"></script>
<script src="js/session/tick.js"></script>
<script src="js/views/log.js"></script>
<script src="js/views/plus.js"></script>
<script src="js/views/map.js"></script>
<script src="js/views/outcome.js"></script>
<script src="js/modals/render.js"></script>
<script src="js/modals/actions.js"></script>
<script src="js/tour.js"></script>
<script src="js/main.js"></script>
</body>
</html>
